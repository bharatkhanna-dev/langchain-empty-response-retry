[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-empty-response-retry"
version = "0.1.0"
description = "Model-agnostic LangChain agent middleware that retries with a corrective nudge when the model returns no text and no tool calls."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bharat Khanna" }]
keywords = ["langchain", "langgraph", "middleware", "agents", "empty-response", "retry", "reliability"]
classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: Developers",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
"Operating System :: OS Independent",
"Topic :: Software Development :: Libraries :: Python Modules",
"Typing :: Typed",
]
dependencies = [
"langchain>=1.3.0",
"langchain-core>=1.4.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0.0",
"pytest-asyncio>=0.24.0",
"ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/bharatkhanna-dev/langchain-empty-response-retry"
Repository = "https://github.com/bharatkhanna-dev/langchain-empty-response-retry"
Issues = "https://github.com/bharatkhanna-dev/langchain-empty-response-retry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_empty_response_retry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
